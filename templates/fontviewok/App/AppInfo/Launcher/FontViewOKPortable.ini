[Launch]
ProgramExecutable=FontViewOK\FontViewOK_p.exe
ProgramExecutable64=FontViewOK\FontViewOK_x64_p.exe
DirectoryMoveOK=yes
SupportsUNC=yes

[FilesMove]
FontViewOK.ini=%PAL:AppDir%\FontViewOK

[FileWrite1]
Type=Replace
File=%PAL:DataDir%\FontViewOK.ini
Find=%PAL:LastDrive%%PAL:LastPackagePartialDir%\
Replace=%PAL:Drive%%PAL:PackagePartialDir%\

[FileWrite2]
Type=Replace
File=%PAL:DataDir%\FontViewOK.ini
Find=%PAL:LastPortableAppsBaseDir%\
Replace=%PAL:PortableAppsBaseDir%\

[FileWrite3]
Type=Replace
File=%PAL:DataDir%\FontViewOK.ini
Find=%PAL:LastDrive%\
Replace=%PAL:Drive%\
